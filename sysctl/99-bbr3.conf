net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_ecn = 2
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# Default kernel terlalu kecil untuk streaming 4K/high-bitrate
net.core.netdev_max_backlog = 16384  # naik dari 4096

# TCP buffer untuk BBR3 + BDP tinggi
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Autotune window — middle dikurangi vs saran Claude Code (mengurangi memory waste)
net.ipv4.tcp_rmem = 4096 262144 33554432
net.ipv4.tcp_wmem = 4096 262144 33554432

# Anti-bufferbloat sender-side (untuk BBR + interactive TCP)
net.ipv4.tcp_notsent_lowat = 131072

# Matikan slow-start setelah koneksi idle (penting untuk Moonlight reconnect)
net.ipv4.tcp_slow_start_after_idle = 0

# === TCP Advanced ===
# Thin stream linear timeouts (SSH, Moonlight TCP control, VoIP)
net.ipv4.tcp_thin_linear_timeouts = 1

# RFC 1337 — TIME-WAIT assassination protection
net.ipv4.tcp_rfc1337 = 1

# Quicker socket reclaim
net.ipv4.tcp_fin_timeout = 15

# Reuse TIME_WAIT (RFC 6191, safe untuk client)
net.ipv4.tcp_tw_reuse = 1

# Burst SYN handling
net.ipv4.tcp_max_syn_backlog = 8192

# Jangan cache TCP metrics ke route cache (frequent roaming)
net.ipv4.tcp_no_metrics_save = 1

# === Network softirq ===
# Budget RX softirq untuk WiFi 6E + multiqueue
net.core.netdev_budget = 600
