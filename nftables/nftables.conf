#!/usr/sbin/nft -f
# /etc/nftables.conf

# Flush HANYA table milik kita, jangan flush table Tailscale (ip filter, ip nat)
table inet filter
delete table inet filter

table inet mangle
delete table inet mangle

# ─── Firewall utama ────────────────────────────────────────────────────────────
table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        # Waydroid DHCP/DNS
        iifname "waydroid0" udp dport { 53, 67 } accept
        iifname "waydroid0" tcp dport { 53, 67 } accept

        # Loopback
        iifname "lo" accept

        # Drop invalid
        ct state invalid drop

        # Stateful
        ct state { established, related } accept

        # ICMPv4 rate limit
        ip protocol icmp limit rate 10/second accept

        # ICMPv6: NDP/MLD wajib lolos penuh, hanya echo-request yang di-rate-limit
        ip6 nexthdr ipv6-icmp icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, nd-redirect, mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request limit rate 10/second accept

        # Tailscale whitelist
        iifname "tailscale0" accept
        udp dport 41641 accept

        # Log drop (uncomment untuk debug)
        # log prefix "nft-drop: " drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Waydroid container internet
        iifname "waydroid0" accept
        oifname "waydroid0" ct state established,related accept
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# ─── Waydroid NAT ──────────────────────────────────────────────────────────────
table ip nat {
    chain posterouting {
        type nat hook postrouting priority filter; policy accept;
    }
}
flush chain ip nat posterouting

table ip nat {
    chain posterouting {
        ip saddr 192.168.240.0/24 oifname != "waydroid0" masquerade
        ip saddr 192.168.250.0/24 oifname != "waydroid0" masquerade
    }
}

# ─── MSS Clamping untuk Tailscale/WireGuard ────────────────────────────────────
# MTU tailscale0 = 1280
# MSS max IPv4 = 1280 - 20(IP) - 20(TCP) = 1240, pakai 1220 untuk safety margin
# MSS max IPv6 = 1280 - 40(IPv6) - 20(TCP) = 1220
table inet mangle {
    chain forward {
        type filter hook forward priority mangle; policy accept;

        # Clamp traffic yang melewati tunnel Tailscale
        iifname "tailscale0" tcp flags syn tcp option maxseg size set 1220
        oifname "tailscale0" tcp flags syn tcp option maxseg size set 1220
    }

    chain output {
        type filter hook output priority mangle; policy accept;

        # Clamp traffic yang dibuat lokal dan keluar via tailscale0
        oifname "tailscale0" tcp flags syn tcp option maxseg size set 1220
    }
}
