[Resolve]
# Primary DNS: Cloudflare (IPv4 + IPv6)
# Secondary DNS: Google (IPv4 + IPv6)
DNS=1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 8.8.8.8#dns.google 2001:4860:4860::8888#dns.google
FallbackDNS=1.0.0.1#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com 8.8.4.4#dns.google 2001:4860:4860::8844#dns.google

# Catch-all routing domain (~.) to route all internet queries through Global DNS
# Specific routing domains (e.g. ~telkom.co.id on tun0) will take precedence due to longer suffix match
Domains=~.

# Enable DNS-over-TLS (opportunistic for resilience and encryption)
DNSOverTLS=opportunistic
