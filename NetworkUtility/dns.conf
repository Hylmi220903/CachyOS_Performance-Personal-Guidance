[Resolve]
# Primary DNS: Quad9 (IPv4 + IPv6) - Malware protection & privacy
# Secondary DNS: Cloudflare (IPv4 + IPv6) - Speed & reliability
DNS=9.9.9.9 1.1.1.1 2620:fe::fe 2606:4700:4700::1111
FallbackDNS=149.112.112.112 1.0.0.1 2620:fe::9 2606:4700:4700::1001

# Catch-all routing domain (~.) to route all internet queries through Global DNS
Domains=~.

# Disable DNS-over-TLS (port 853 is blocked/dropped on Telkom intranet)
DNSOverTLS=no

# Disable LLMNR multicast broadcasts
LLMNR=no

# DNSSEC validation mode
DNSSEC=no

# Cache settings
Cache=yes
CacheFromLocalhost=no
StaleRetentionSec=3600
